<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.1); }

        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; }
        #login-screen h1 { font-size: 24px; margin-bottom: 30px; color: #333; }
        #login-screen input { padding: 12px 20px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; width: 100%; max-width: 400px; margin-bottom: 16px; }
        #login-screen button { padding: 12px 40px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #login-screen button:hover { background: #45a049; }

        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #chat-header { padding: 15px 20px; background: #4CAF50; color: white; display: flex; justify-content: space-between; align-items: center; }
        #chat-header .user-info { font-size: 14px; }
        #chat-header button { padding: 8px 16px; background: #fff; color: #4CAF50; border: none; border-radius: 4px; cursor: pointer; }

        #chat-messages { flex: 1; overflow-y: auto; padding: 20px; }
        .message { margin-bottom: 15px; padding: 12px 16px; border-radius: 12px; max-width: 80%; }
        .message.user { background: #4CAF50; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .message.assistant { background: #e0e0e0; color: #333; border-bottom-left-radius: 4px; }
        .message .meta { font-size: 11px; opacity: 0.7; margin-top: 5px; }

        #chat-input-area { padding: 15px 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        #chat-input-area input { flex: 1; padding: 12px 16px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; }
        #chat-input-area input:focus { outline: none; border-color: #4CAF50; }
        #chat-input-area button { padding: 12px 24px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #chat-input-area button:hover { background: #45a049; }
        #chat-input-area button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-screen">
            <h1>欢迎使用 AI 聊天机器人</h1>
            <input type="text" id="user-id-input" placeholder="请输入 user_id" maxlength="50">
            <input type="text" id="agent-id-input" placeholder="请输入 agent_id" maxlength="50">
            <button onclick="submitScope()">进入聊天</button>
        </div>

        <div id="chat-screen">
            <div id="chat-header">
                <span class="user-info">
                    当前作用域:
                    <strong id="current-user-id"></strong> /
                    <strong id="current-agent-id"></strong>
                </span>
                <button onclick="logout()">切换作用域</button>
            </div>
            <div id="chat-messages"></div>
            <div id="chat-input-area">
                <input type="text" id="message-input" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" id="send-btn">发送</button>
            </div>
        </div>
    </div>

    <script>
        let currentScope = {
            userId: '',
            agentId: '',
        };

        function submitScope() {
            const userId = document.getElementById('user-id-input').value.trim();
            const agentId = document.getElementById('agent-id-input').value.trim();
            if (!userId || !agentId) {
                alert('请完整输入 user_id 和 agent_id');
                return;
            }

            currentScope = { userId, agentId };
            document.getElementById('current-user-id').textContent = userId;
            document.getElementById('current-agent-id').textContent = agentId;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
        }

        function logout() {
            currentScope = { userId: '', agentId: '' };
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('user-id-input').value = '';
            document.getElementById('agent-id-input').value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;

            const msgToSend = message;
            input.value = '';

            addMessage(msgToSend, 'user');

            try {
                const formData = new FormData();
                formData.append('message', msgToSend);
                formData.append('user_id', currentScope.userId);
                formData.append('agent_id', currentScope.agentId);

                const res = await fetch('/api/chat', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    addMessage(data.response, 'assistant', `耗时 ${data.duration}s`);
                } else {
                    addMessage('错误: ' + data.detail, 'assistant');
                }
            } catch (e) {
                addMessage('网络错误，请稍后重试', 'assistant');
            }

            sendBtn.disabled = false;
            input.focus();
        }

        function addMessage(content, role, meta='') {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = content + (meta ? `<div class="meta">${meta}</div>` : '');
            document.getElementById('chat-messages').appendChild(div);
            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
        }
    </script>
</body>
</html>
